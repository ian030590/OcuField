name: Build and release OcuField

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-deps -r requirements.lock
      - name: Run public tests
        run: .\.venv\Scripts\python.exe -m pytest tests
      - name: Build executable
        run: .\build.ps1
      - name: Verify hidden rendering or report GDI Generic
        run: |
          $directory = Join-Path $PWD '.selftest\ci'
          $process = Start-Process -FilePath '.\dist\OcuField.exe' -ArgumentList "--self-test `"$directory`"" -WindowStyle Hidden -Wait -PassThru
          $report = Join-Path $directory 'selftest.json'
          $errorLog = Join-Path $directory 'selftest-error.txt'
          if ($process.ExitCode -eq 0 -and (Test-Path -LiteralPath $report -PathType Leaf)) {
            Write-Host 'Hidden self-test passed, including pixel alignment.'
            exit 0
          }
          if (Test-Path -LiteralPath $errorLog -PathType Leaf) {
            $diagnostics = Get-Content -Raw -LiteralPath $errorLog
            Write-Host $diagnostics
            if ($process.ExitCode -ne 0 -and -not (Test-Path -LiteralPath $report) -and
                $diagnostics -cmatch 'GRAPHICS_CHECK_FAILED' -and $diagnostics -cmatch 'GDI Generic') {
              Write-Host 'GDI Generic failed the mandatory graphics check. CI could not verify rendering or pixel alignment.'
              exit 0
            }
          }
          throw "Unexpected OcuField self-test result (exit code $($process.ExitCode))."
      - uses: actions/upload-artifact@v4
        with:
          name: OcuField
          path: dist/OcuField.exe
          if-no-files-found: error
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OcuField
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum OcuField.exe > OcuField.exe.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" OcuField.exe OcuField.exe.sha256 LICENSE --clobber
          else
            gh release create "$RELEASE_TAG" OcuField.exe OcuField.exe.sha256 LICENSE --verify-tag --generate-notes
          fi
